<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>طاولة التصميم</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&family=Cairo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swapwrap:wrap;gap:12px;
}
.top h1{
  font-family:'Tajawal',sans-serif;font-weight:900;
  font-size:clamp(24px,3.4vw,34px);margin:0;
}
.top .sub{color:var(--muted);font-size:13px;margin-top:4px;}
.btn{
  border:1px solid var(--hair);background:var(--panel);color:var(--paper);
  font-family:'Cairo',sans-serif;font-weight:600;font-size:13px;
  padding:9px 16px;border-radius:5px;cursor:pointer;transition:.15s;
}
.btn:hover{border-color:var(--accent);color:var(--accent);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1B140D;}
.btn.primary:hover{opacity:.9;color:#1B140D;}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;}

/* ---------- LAYOUT ---------- */
.desk{display:grid;grid-template-columns:220px 1fr 260px;gap:18px;align-items:start;}
@media(max-width:980px){.desk{grid-template-columns:1fr;}}

/* ---------- PAGE LIST (index cards on tape) ---------- */
.pages-panel{background:var(--panel);border:1px solid var(--hair);border-radius:8px;padding:16px;}
.pages-panel h3{font-family:'Tajawal',sans-serif;font-size:13px;margin:0 0 12px;color:var(--muted);}
.page-card{
  position:relative;background:var(--paper);color:var(--ink);
  border-radius:3px;padding:10px 10px 8px;margin-bottom:16px;cursor:pointer;
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;
  box-shadow:0 6px 14px rgba(0,0,0,0.28);
  transform:rotate(var(--r,0deg));
  border:2px solid transparent;
}
.page-card:nth-child(odd){--r:-1.3deg;}
.page-card:nth-child(even){--r:1deg;}
.page-card.active{border-color:var(--accent);}
.page-card::before{
  content:"";position:absolute;top:-8px;right:20px;width:34px;height:14px;
  background:var(--card-tape);opacity:.85;transform:rotate(-3deg);
}
.page-card .pnum{font-weight:700;color:var(--accent);}
.page-card .ptitle{
  font-family:'Cairo',sans-serif;font-size:12.5px;font-weight:600;
  margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.add-page{
  width:100%;background:transparent;border:1.5px dashed var(--hair);color:var(--muted);
  border-radius:6px;padding:10px;font-family:'Cairo',sans-serif;font-size:12.5px;cursor:pointer;
}
.add-page:hover{border-color:var(--accent);color:var(--accent);}

/* ---------- PREVIEW / RULER ---------- */
.stage{display:flex;flex-direction:column;align-items:center;}
.ruler-row{display:flex;width:100%;max-width:420px;}
.ruler-corner{width:22px;}
.ruler-x{
  flex:1;height:22px;position:relative;
  background:repeating-linear-gradient(90deg, var(--muted) 0 1px, transparent 1px 20px);
  opacity:.5;
}
.ruler-wrap{display:flex;}
.ruler-y{
  width:22px;position:relative;
  background:repeating-linear-gradient(180deg, var(--muted) 0 1px, transparent 1px 20px);
  opacity:.5;
}

.page-canvas{
  width:400px;max-width:100%;aspect-ratio:148/210;
  background:var(--paper);color:var(--ink);
  box-shadow:0 22px 50px rgba(0,0,0,0.45);
  border-radius:2px;
  padding:26px 24px;
  display:flex;flex-direction:column;
  font-family:'Cairo',sans-serif;
  position:relative;
  overflow:hidden;
}
.page-canvas .pg-eyebrow{
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1.5px;
  color:var(--theme-accent,var(--accent));text-transform:uppercase;margin-bottom:8px;
}
.page-canvas h2{
  font-family:'Tajawal',sans-serif;font-weight:900;font-size:22px;line-height:1.3;
  margin:0 0 10px;color:var(--ink);
}
.page-canvas .pg-body{font-size:12.5px;line-height:1.85;color:#3A3F38;flex:1;overflow:auto;}
.page-canvas .pg-body ul{margin:0;padding:0 16px 0 0;}
.page-canvas .pg-body li{margin-bottom:8px;}
.page-canvas .pg-footer{
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--muted);
  border-top:1px solid #0000001a;padding-top:8px;margin-top:10px;
  display:flex;justify-content:space-between;
}
.page-canvas.cover{
  justify-content:center;align-items:center;text-align:center;
  background:var(--theme-accent,var(--accent));color:#fff;
}
.page-canvas.cover h2{color:#fff;font-size:26px;}
.page-canvas.cover .pg-tagline{font-size:12.5px;opacity:.9;margin-top:8px;}
.page-canvas.cover .pg-eyebrow{color:rgba(255,255,255,0.75);}
.page-canvas.cta{background:var(--ink);color:var(--paper);}
.page-canvas.cta h2{color:var(--paper);}
.page-canvas.cta .pg-body{color:#D9DED6;}

.zoom-note{font-size:11px;color:var(--muted);margin-top:10px;text-align:center;}

/* ---------- INSPECTOR ---------- */
.inspector{background:var(--panel);border:1px solid var(--hair);border-radius:8px;padding:16px;}
.inspector h3{font-family:'Tajawal',sans-serif;font-size:13px;margin:0 0 12px;color:var(--muted);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;}
.field input[type=text], .field textarea, .field select{
  width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--hair);
  border-radius:4px;padding:8px 9px;color:var(--paper);font-family:'Cairo',sans-serif;
  font-size:12.5px;resize:vertical;
}
.field textarea{min-height:90px;line-height:1.6;}
.layout-picker{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.layout-picker button{
  background:rgba(255,255,255,0.04);border:1px solid var(--hair);color:var(--muted);
  border-radius:5px;padding:7px 4px;font-size:11px;cursor:pointer;font-family:'Cairo',sans-serif;
}
.layout-picker button.active{border-color:var(--accent);color:var(--accent);}
.theme-row{display:flex;gap:8px;}
.swatch{
  width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;
}
.swatch.active{border-color:#fff;}
.danger{color:#D97757;background:transparent;border:1px solid rgba(217,119,87,0.4);}
.danger:hover{background:rgba(217,119,87,0.12);}

.foot-note{text-align:center;font-size:11px;color:var(--muted);opacity:.6;margin-top:34px;font-family:'IBM Plex Mono',monospace;}

/* ---------- PRINT ---------- */
@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{position:absolute;top:0;left:0;width:100%;}
  .print-page{
    width:148mm;height:210mm;page-break-after:always;
    padding:18mm 16mm;box-sizing:border-box;
    display:flex;flex-direction:column;font-family:'Cairo',sans-serif;
  }
  @page{size:148mm 210mm;margin:0;}
}
#printArea{display:none;}
</style>
</head>

<div class="wrap">

  <div class="top">
    <div>
      <h1>طاولة التصميم</h1>
      <div class="sub">صمّم كتيّب منتجك الرقمي — غلاف، صفحات، ودعوة لاتخاذ إجراء</div>
    </div>
    <div class="toolbar">
      <button class="btn" onclick="duplicatePage()">تكرار الصفحة</button>
      <button class="btn primary" onclick="doPrint()">تصدير PDF للطباعة</button>
    </div>
  </div>

  <div class="desk">

    <!-- PAGES LIST -->
    <div class="pages-panel">
      <h3>صفحات الكتيّب</h3>
      <div id="pageList"></div>

      </div>
      <div class="zoom-note">مقاس الكتيّب: A5 (148 × 210 مم) — المعاينة مصغّرة</div>
    </div>
